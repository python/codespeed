name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install mercurial
        # hg is no longer preinstalled on the ubuntu-latest runner image
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mercurial
          hg --version

      - name: Install dependencies
        run: pip install -e .

      - name: Run tests
        run: python manage.py test codespeed --settings=codespeed.tests.settings
